name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copiar o app web para dentro do APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html style.css app.js sw.js manifest.webmanifest icon.svg android/app/src/main/assets/www/

      - name: Gravar a versão no app (build e commit)
        run: |
          sed -i "s/__VERSAO__/build ${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}/" android/app/src/main/assets/www/app.js
          grep -n "VERSAO_BRUTA = " android/app/src/main/assets/www/app.js

      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: lembrete-remedios-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como release (link direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lembrete de Remédios - build ${{ github.run_number }}
          body: "Commit ${{ github.sha }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
