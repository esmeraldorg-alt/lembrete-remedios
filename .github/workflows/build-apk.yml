name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copiar o app web para dentro do APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html style.css app.js sw.js manifest.webmanifest icon.svg android/app/src/main/assets/www/

      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: lembrete-remedios-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
